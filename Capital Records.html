<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capital Shipping | Goodrich Filing Search Portal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --navy: #0b1f33;
    --navy-light: #123d63;
    --gold: #c5a059;
    --gold-light: #e5c178;
    --bg: #f4f7fb;
    --card: #ffffff;
    --text: #172033;
    --muted: #667085;
    --border: #e5eaf0;
    --shadow: 0 10px 30px rgba(15,35,60,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 40px; }

  /* Login Overlay Styles with Image Background */
  #loginOverlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: url('bg-banner.png') no-repeat center center / cover;
    display: flex; justify-content: center; align-items: center;
    z-index: 1000;
  }

  /* Semi-transparent dark overlay for high readability */
  #loginOverlay::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(8, 27, 45, 0.45);
    backdrop-filter: blur(4px);
    z-index: 1;
  }

  .login-card {
    position: relative;
    z-index: 2;
    background: rgba(255, 255, 255, 0.95);
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.35);
    width: 100%; max-width: 400px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.4);
  }

  .login-card h2 { color: var(--navy); margin-bottom: 6px; font-size: 22px; font-weight: 700; }
  .login-card p { color: var(--muted); font-size: 13px; margin-bottom: 24px; font-weight: 500; }

  .login-field { margin-bottom: 16px; text-align: left; }
  .login-field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; }
  .login-field input {
    width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; background: #fff;
  }
  .login-field input:focus { border-color: var(--navy-light); box-shadow: 0 0 0 3px rgba(18,61,99,0.15); }

  .btn-login {
    width: 100%; padding: 12px; background: var(--navy-light); color: #fff; border: none; border-radius: 8px;
    font-weight: 600; font-size: 15px; cursor: pointer; transition: background 0.2s; margin-top: 10px;
  }
  .btn-login:hover { background: var(--navy); }

  .error-msg { color: #d32f2f; font-size: 13px; margin-top: 12px; display: none; font-weight: 600; }

  /* App Dashboard Styles */
  #appContent { display: none; }

  header {
    background: linear-gradient(135deg, #081b2d, var(--navy-light));
    color: #fff;
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }

  .brand { display: flex; align-items: center; gap: 15px; }
  .logo {
    width: 44px; height: 44px; border-radius: 12px;
    background: rgba(255,255,255,0.12);
    display: grid; place-items: center; font-size: 22px;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .brand h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
  .brand p { font-size: 12px; color: var(--gold-light); opacity: 0.9; }

  .hero-banner-container {
    max-width: 1400px;
    margin: 20px auto 0 auto;
    padding: 0 20px;
  }
  .hero-banner-container img {
    width: 100%;
    height: auto;
    border-radius: 14px;
    box-shadow: var(--shadow);
    display: block;
  }

  .container { max-width: 1400px; margin: 24px auto; padding: 0 20px; }

  .filter-card {
    background: var(--card);
    border-radius: 14px;
    padding: 24px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    margin-bottom: 24px;
  }

  .filter-title {
    font-size: 15px; font-weight: 700; color: var(--navy); margin-bottom: 18px;
    display: flex; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: 0.5px;
  }

  .filter-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; align-items: end;
  }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  
  input, select {
    width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; outline: none; transition: all 0.2s ease; background: #fcfdfe;
  }

  input:focus, select:focus {
    border-color: var(--navy-light); box-shadow: 0 0 0 3px rgba(18,61,99,0.1); background: #fff;
  }

  .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }

  .btn {
    padding: 10px 18px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
    border: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s ease;
  }

  .btn-primary { background: var(--navy-light); color: #fff; }
  .btn-primary:hover { background: var(--navy); }

  .btn-excel { background: #107c41; color: #fff; }
  .btn-excel:hover { background: #0b592e; }

  .btn-reset { background: #e2e8f0; color: #475569; }
  .btn-reset:hover { background: #cbd5e1; }

  .btn-logout { background: #dc2626; color: #fff; padding: 8px 16px; font-size: 13px; border-radius: 6px; }
  .btn-logout:hover { background: #b91c1c; }

  .table-card {
    background: var(--card); border-radius: 14px; box-shadow: var(--shadow); border: 1px solid var(--border); overflow: hidden;
  }

  .table-header {
    padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #fafbfc; gap: 12px;
  }

  .results-count { font-size: 14px; font-weight: 600; color: var(--navy); }
  .updated-pill {
    font-size: 12px; color: var(--muted); background: #eef4ff; border: 1px solid #dbe7ff; padding: 6px 10px; border-radius: 999px; font-weight: 600;
  }

  .table-wrapper { overflow-x: auto; max-height: 650px; }

  table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
  th {
    background: #f1f5f9; color: var(--navy); font-weight: 700; padding: 12px 16px; position: sticky; top: 0;
    border-bottom: 2px solid var(--border); white-space: nowrap; z-index: 2;
  }
  td { padding: 12px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; color: #334155; }
  tr:hover td { background: #f8fafc; }

  .badge-status {
    padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; display: inline-block;
  }
  .badge-completed { background: #dcfce7; color: #15803d; }
  .badge-pending { background: #fef9c3; color: #a16207; }

  .pagination {
    display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; border-top: 1px solid var(--border); background: #fafbfc; font-size: 13px;
  }
  .page-btns { display: flex; gap: 8px; }

  .empty-state { text-align: center; padding: 50px 20px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>

<!-- Login Modal Overlay -->
<div id="loginOverlay">
  <div class="login-card">
    <h2>Portal Login</h2>
    <p>Capital Shipping Private Limited</p>
    <form id="loginForm">
      <div class="login-field">
        <label for="username">User Name</label>
        <input type="text" id="username" placeholder="Enter username" required autocomplete="off">
      </div>
      <div class="login-field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn-login">Sign In</button>
      <div id="errorMsg" class="error-msg">Invalid Username or Password</div>
    </form>
  </div>
</div>

<!-- App Dashboard Content -->
<div id="appContent">
  <header>
    <div class="brand">
      <div class="logo">⚓</div>
      <div>
        <h1>Capital Shipping Registry</h1>
        <p>Goodrich Integrated Filing & Document Search Portal</p>
      </div>
    </div>
    <button class="btn btn-logout" id="logoutBtn">Logout</button>
  </header>


  <div class="container">
    <!-- Filters -->
    <div class="filter-card">
      <div class="filter-title">🔍 Search & Filter Options</div>
      <div class="filter-grid">
        
        <div class="field">
          <label for="categoryFilter">Filing Category</label>
          <select id="categoryFilter">
            <option value="ALL">All Categories</option>
            <option value="SEZ EXPORT">SEZ EXPORT</option>
            <option value="ZONE TO ZONE TRANSFER">ZONE TO ZONE TRANSFER</option>
            <option value="EOU TO SEZ BOE">EOU TO SEZ BOE</option>
            <option value="IUT-GOODRICH">IUT-GOODRICH</option>
            <option value="DTA PROCUREMENT">DTA PROCUREMENT</option>
            <option value="DTA SERVICES">DTA SERVICES</option>
            <option value="DTA SALES">DTA SALES</option>
          </select>
        </div>

        <div class="field">
          <label for="idSearch">Search ID / Number / Name</label>
          <input type="text" id="idSearch" placeholder="Request ID, Invoice, Job No, Supplier...">
        </div>

        <div class="field">
          <label for="startDate">From Date</label>
          <input type="date" id="startDate">
        </div>

        <div class="field">
          <label for="endDate">To Date</label>
          <input type="date" id="endDate">
        </div>

        <div class="field">
          <label for="statusFilter">Status</label>
          <select id="statusFilter">
            <option value="ALL">All Statuses</option>
            <option value="Completed">Completed</option>
            <option value="Pending">Pending / In Progress</option>
          </select>
        </div>

        <div class="btn-group">
          <button class="btn btn-primary" id="searchBtn">Apply Filter</button>
          <button class="btn btn-reset" id="resetBtn">Reset</button>
          <button class="btn btn-excel" id="exportBtn">Export Excel</button>
        </div>

      </div>
    </div>

    <!-- Table Results -->
    <div class="table-card">
      <div class="table-header">
        <div class="results-count" id="resultsCount">Showing records...</div>
        <div class="btn-group">
          <div class="updated-pill" id="lastUpdated">Last updated: --</div>
          <button class="btn btn-reset" id="refreshBtn">Refresh Now</button>
        </div>
      </div>
      <div class="table-wrapper" id="tableContainer"></div>
      <div class="pagination">
        <div id="pageInfo">Page 1 of 1</div>
        <div class="page-btns">
          <button class="btn btn-reset" id="prevPage">Previous</button>
          <button class="btn btn-reset" id="nextPage">Next</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// Authentication Logic
const AUTH_USER = "Admin";
const AUTH_PASS = "Capital@321";

const loginOverlay = document.getElementById('loginOverlay');
const appContent = document.getElementById('appContent');
const loginForm = document.getElementById('loginForm');
const errorMsg = document.getElementById('errorMsg');
const logoutBtn = document.getElementById('logoutBtn');

function checkAuth() {
  if (sessionStorage.getItem('authenticated') === 'true') {
    loginOverlay.style.display = 'none';
    appContent.style.display = 'block';
    loadDataset();
  } else {
    loginOverlay.style.display = 'flex';
    appContent.style.display = 'none';
  }
}

loginForm.addEventListener('submit', function(e) {
  e.preventDefault();
  const user = document.getElementById('username').value.trim();
  const pass = document.getElementById('password').value.trim();

  if (user === AUTH_USER && pass === AUTH_PASS) {
    sessionStorage.setItem('authenticated', 'true');
    errorMsg.style.display = 'none';
    checkAuth();
  } else {
    errorMsg.style.display = 'block';
  }
});

logoutBtn.addEventListener('click', function() {
  sessionStorage.removeItem('authenticated');
  checkAuth();
});

// Google Sheets live data configuration
const GOOGLE_SHEET_ID = '1hQdvGR4g20aaf5AKo_SZBfN-xpeBPITrGmRtadAceeg';
const SHEET_NAMES = ['SEZ EXPORT', 'ZONE TO ZONE TRANSFER', 'EOU TO SEZ BOE', 'IUT-GOODRICH', 'DTA PROCUREMENT', 'DTA SERVICES', 'DTA SALES'];
const LIVE_REFRESH_MS = 10000;

// Excel Search Application Code
let masterData = [];
let filteredData = [];
let currentPage = 1;
const pageSize = 100;

function getSheetCsvUrl(sheetName) {
  if (!GOOGLE_SHEET_ID || GOOGLE_SHEET_ID === 'PASTE_YOUR_GOOGLE_SHEET_ID_HERE') {
    return null;
  }
  const sheetParam = encodeURIComponent(sheetName);
  return `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${sheetParam}`;
}

async function loadDataset() {
  if (!GOOGLE_SHEET_ID || GOOGLE_SHEET_ID === 'PASTE_YOUR_GOOGLE_SHEET_ID_HERE') {
    console.warn('Google Sheet ID not configured. Add your Google Sheet ID in the script to enable live sheet sync.');
    masterData = [];
    filteredData = [];
    renderTable();
    return;
  }

  try {
    const sheetResults = await Promise.all(
      SHEET_NAMES.map(async (sheetName) => {
        const url = getSheetCsvUrl(sheetName);
        if (!url) return [];

        const response = await fetch(url, { cache: 'no-store' });
        if (!response.ok) return [];

        const csvText = await response.text();
        return parseSheetCsv(csvText, sheetName);
      })
    );

    masterData = sheetResults.flat();
    console.log(`Loaded ${masterData.length} live records from Google Sheets.`);
  } catch (e) {
    console.error('Unable to load live Google Sheet data:', e);
    masterData = [];
  }

  if (!window.__sheetLiveRefreshStarted) {
    startLiveRefresh();
    window.__sheetLiveRefreshStarted = true;
  }

  filteredData = [...masterData];
  filterRecords();
  renderTable();
}

function normalizeText(value) {
  return String(value ?? '').trim();
}

function normalizeDateString(value) {
  const raw = normalizeText(value);
  if (!raw) return '';

  if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;

  const monthMap = {
    Jan: '01', Feb: '02', Mar: '03', Apr: '04', May: '05', Jun: '06',
    Jul: '07', Aug: '08', Sep: '09', Oct: '10', Nov: '11', Dec: '12'
  };

  const dayMonthYear = raw.match(/^(\d{1,2})[-/\s](Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[-/\s](\d{4})$/i);
  if (dayMonthYear) {
    const day = String(dayMonthYear[1]).padStart(2, '0');
    const month = monthMap[dayMonthYear[2].charAt(0).toUpperCase() + dayMonthYear[2].slice(1).toLowerCase()];
    const year = dayMonthYear[3];
    return `${year}-${month}-${day}`;
  }

  const yearMonthDay = raw.match(/^(\d{4})[-/\s](\d{1,2})[-/\s](\d{1,2})$/);
  if (yearMonthDay) {
    const year = yearMonthDay[1];
    const month = String(yearMonthDay[2]).padStart(2, '0');
    const day = String(yearMonthDay[3]).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  const parsed = new Date(raw);
  if (!isNaN(parsed.getTime())) {
    const year = parsed.getUTCFullYear ? parsed.getUTCFullYear() : parsed.getFullYear();
    const month = String((parsed.getUTCMonth ? parsed.getUTCMonth() : parsed.getMonth()) + 1).padStart(2, '0');
    const day = String(parsed.getUTCDate ? parsed.getUTCDate() : parsed.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  return raw;
}

function parseSheetCsv(csvText, sheetName) {
  if (!csvText || !csvText.trim()) return [];

  try {
    const workbook = XLSX.read(csvText, { type: 'string', raw: false });
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '' });
    if (!rows || rows.length <= 1) return [];

    const headers = rows[0].map((header) => normalizeText(header).toLowerCase());
    const records = [];

    rows.slice(1).forEach((row) => {
      if (!row || !Array.isArray(row) || row.every((cell) => !normalizeText(cell))) return;

      const obj = {};
      headers.forEach((header, index) => {
        obj[header] = normalizeText(row[index]);
      });

      const refNo = obj['job no'] || obj['request id'] || obj['request no'] || obj['sb no'] || obj['reference no'] || obj['reference'] || obj['sl no'] || '';
      const dateVal = obj['job date'] || obj['date'] || obj['sb date'] || obj['invoice date'] || '';
      const invNo = obj['invoice no'] || obj['invoice number'] || obj['invoice'] || '';
      const entity = obj['supplier'] || obj['entity name'] || obj['party name'] || obj['supplier / entity'] || obj['name'] || 'Goodrich Aerospace';
      const status = obj['etp status'] || obj['status'] || 'Completed';

      if (!refNo && !invNo && !entity && !dateVal) return;

      records.push({
        category: sheetName,
        refNo: refNo || 'N/A',
        date: dateVal || 'N/A',
        invNo: invNo || 'N/A',
        entity: entity || 'N/A',
        status: status || 'Completed'
      });
    });

    return records;
  } catch (error) {
    console.error(`Error parsing sheet ${sheetName}:`, error);
    return [];
  }
}

function startLiveRefresh() {
  setInterval(() => {
    loadDataset();
  }, LIVE_REFRESH_MS);
}

function updateLastUpdatedLabel() {
  const el = document.getElementById('lastUpdated');
  if (!el) return;
  const now = new Date();
  el.innerText = `Last updated: ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
}

function renderTable() {
  const container = document.getElementById('tableContainer');
  const countEl = document.getElementById('resultsCount');
  const pageInfo = document.getElementById('pageInfo');

  updateLastUpdatedLabel();
  countEl.innerText = `Showing ${filteredData.length.toLocaleString()} matching record(s)`;

  if (filteredData.length === 0) {
    container.innerHTML = `<div class="empty-state">No filing records match your search criteria.</div>`;
    pageInfo.innerText = "Page 0 of 0";
    return;
  }

  const totalPages = Math.ceil(filteredData.length / pageSize);
  if (currentPage > totalPages) currentPage = totalPages;
  if (currentPage < 1) currentPage = 1;

  const startIdx = (currentPage - 1) * pageSize;
  const pageRecords = filteredData.slice(startIdx, startIdx + pageSize);

  let html = `<table>
    <thead>
      <tr>
        <th>Category</th>
        <th>Reference / Job / Request ID</th>
        <th>Date</th>
        <th>Invoice Number</th>
        <th>Supplier / Entity Name</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>`;

  pageRecords.forEach(item => {
    const isCompleted = /completed|approved|issued/i.test(item.status);
    const badgeClass = isCompleted ? 'badge-completed' : 'badge-pending';

    html += `<tr>
      <td><strong>${escapeHtml(item.category)}</strong></td>
      <td>${escapeHtml(item.refNo)}</td>
      <td>${escapeHtml(item.date)}</td>
      <td>${escapeHtml(item.invNo)}</td>
      <td>${escapeHtml(item.entity)}</td>
      <td><span class="badge-status ${badgeClass}">${escapeHtml(item.status)}</span></td>
    </tr>`;
  });

  html += `</tbody></table>`;
  container.innerHTML = html;
  pageInfo.innerText = `Page ${currentPage} of ${totalPages} (${filteredData.length.toLocaleString()} total items)`;
}

function filterRecords() {
  const category = document.getElementById('categoryFilter').value;
  const search = document.getElementById('idSearch').value.trim().toLowerCase();
  const startDate = document.getElementById('startDate').value || '';
  const endDate = document.getElementById('endDate').value || '';
  const status = document.getElementById('statusFilter').value;

  filteredData = masterData.filter(item => {
    if (category !== 'ALL' && item.category !== category) return false;

    if (search) {
      const refText = (item.refNo || '').toLowerCase();
      const invText = (item.invNo || '').toLowerCase();
      const entityText = (item.entity || '').toLowerCase();
      const matchSearch = refText.includes(search) || invText.includes(search) || entityText.includes(search);
      if (!matchSearch) return false;
    }

    const itemDate = normalizeDateString(item.date);
    if (startDate && itemDate && itemDate < startDate) return false;
    if (endDate && itemDate && itemDate > endDate) return false;

    if (status !== 'ALL') {
      const isCompleted = /completed|approved|issued/i.test(item.status);
      if (status === 'Completed' && !isCompleted) return false;
      if (status === 'Pending' && isCompleted) return false;
    }

    return true;
  });

  currentPage = 1;
  renderTable();
}

function resetFilters() {
  document.getElementById('categoryFilter').value = 'ALL';
  document.getElementById('idSearch').value = '';
  document.getElementById('startDate').value = '';
  document.getElementById('endDate').value = '';
  document.getElementById('statusFilter').value = 'ALL';
  filterRecords();
}

function exportExcel() {
  if (filteredData.length === 0) {
    alert("No visible data available to export.");
    return;
  }

  const exportRows = filteredData.map(item => ({
    "Filing Category": item.category,
    "Reference / Request ID": item.refNo,
    "Date": item.date,
    "Invoice Number": item.invNo,
    "Supplier / Entity": item.entity,
    "Status": item.status
  }));

  const worksheet = XLSX.utils.json_to_sheet(exportRows);
  const workbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(workbook, worksheet, "Filtered Filings");

  const category = document.getElementById('categoryFilter').value;
  const fileName = category !== 'ALL' ? `Goodrich_Filings_${category}.xlsx` : 'Goodrich_Filtered_Filings.xlsx';

  XLSX.writeFile(workbook, fileName);
}

function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, m => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
  }[m]));
}

// Event Listeners
document.getElementById('searchBtn').addEventListener('click', filterRecords);
document.getElementById('categoryFilter').addEventListener('change', filterRecords);
document.getElementById('statusFilter').addEventListener('change', filterRecords);
document.getElementById('idSearch').addEventListener('input', filterRecords);
document.getElementById('startDate').addEventListener('change', filterRecords);
document.getElementById('endDate').addEventListener('change', filterRecords);
document.getElementById('refreshBtn').addEventListener('click', () => loadDataset());

document.getElementById('prevPage').addEventListener('click', () => { if(currentPage > 1) { currentPage--; renderTable(); } });
document.getElementById('nextPage').addEventListener('click', () => { if(currentPage * pageSize < filteredData.length) { currentPage++; renderTable(); } });

document.getElementById('resetBtn').addEventListener('click', resetFilters);

document.getElementById('exportBtn').addEventListener('click', exportExcel);

// Run Auth Check on page initial load
checkAuth();
</script>
</body>
</html>
